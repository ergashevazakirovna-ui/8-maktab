
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-maktab — 8-D sinf o'quvchilari</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0d10;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      padding: 32px 16px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      background-color: #14181f;
      border: 1px solid #262c36;
      border-radius: 14px;
      padding: 28px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background-color: #1e293b;
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2d3542;
      background-color: #0e1116;
      color: #f9fafb;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
    }

    .search-input:focus {
      border-color: #60a5fa;
    }

    .student-list {
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background-color: #191e27;
      border: 1px solid #252c38;
      border-radius: 10px;
      padding: 12px 16px;
    }

    .student-name {
      font-weight: 600;
      color: #ffffff;
    }

    .student-meta {
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <span class="badge">8-maktab • 8-D sinf</span>
      <span class="student-meta" id="count">Jami: 26 nafar o'quvchi</span>
    </div>

    <h1>8-D sinf o'quvchilari ro'yxati</h1>
    <p class="subtitle">O'quvchini tez topish uchun pastdagi qidiruv qatoriga ism yoki familiyasini yozing.</p>

    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="O'quvchi ismini qidiring..."
    />

    <ul class="student-list" id="studentList"></ul>
  </div>

  <script>
    const students = [
      { name: "Abdullayev Nuriddin", info: "8-D sinf" },
      { name: "Abdumannonova Shaxzoda", info: "8-D sinf" },
      { name: "Axmadjonov Shoxrux", info: "8-D sinf" },
      { name: "Alimov Umid", info: "8-D sinf" },
      { name: "Amridinova Shaxzoda", info: "8-D sinf" },
      { name: "Aripova Aziza", info: "8-D sinf" },
      { name: "Ashurov Davlat", info: "8-D sinf" },
      { name: "Berdiyev Samirjon", info: "8-D sinf" },
      { name: "Djamshedov Zarshed", info: "8-D sinf" },
      { name: "Erkinov Muhammadamin", info: "8-D sinf" },
      { name: "Erkinova Nargiza", info: "8-D sinf" },
      { name: "Hamidov Umid", info: "8-D sinf" },
      { name: "Hamroqulova E'zozabonu", info: "8-D sinf" },
      { name: "Hasanboyeva Sabina", info: "8-D sinf" },
      { name: "Juraboyeva Charos", info: "8-D sinf" },
      { name: "Mamatkulova Charos", info: "8-D sinf" },
      { name: "Orzikulov Laziz", info: "8-D sinf" },
      { name: "Raxmatullayev Ulug'bek", info: "8-D sinf" },
      { name: "Sirojov Sardor", info: "8-D sinf" },
      { name: "Sodiqov Damir", info: "8-D sinf" },
      { name: "Turakulov Otabek", info: "8-D sinf" },
      { name: "Tuychikulov Jamshed", info: "8-D sinf" },
      { name: "Ulmasov Amirjon", info: "8-D sinf" },
      { name: "Yulbarisova Zebo", info: "8-D sinf" },
      { name: "Zoxirov Qodir", info: "8-D sinf" }
    ];

    const listEl = document.getElementById("studentList");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("searchInput");

    function renderStudents(filterText = "") {
      const query = filterText.trim().toLowerCase();
      const filtered = students.filter(s =>
        s.name.toLowerCase().includes(query) || s.info.toLowerCase().includes(query)
      );

      listEl.innerHTML = "";

      if (filtered.length === 0) {
        listEl.innerHTML = `<li class="student-item"><span class="student-meta">Mos o'quvchi topilmadi</span></li>`;
      } else {
        filtered.forEach((student, index) => {
          const li = document.createElement("li");
          li.className = "student-item";
          li.innerHTML = `
            <span class="student-name">${index + 1}. ${student.name}</span>
            <span class="student-meta">${student.info}</span>
          `;
          listEl.appendChild(li);
        });
      }

      countEl.textContent = `Ko'rsatilmoqda: ${filtered.length} / ${students.length}`;
    }

    searchEl.addEventListener("input", (e) => renderStudents(e.target.value));
    renderStudents();
  </script>
</body>
</html>
